name: Release Demo

on:
  push:
    branches: [feature/allow-model-selection]

permissions:
  contents: write

jobs:
  release-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build IIFE demo
        run: npm run build:demo -w page-agent

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "demo-${{ github.run_number }}"
          git push origin --tags

      - name: Upload demo.js to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "demo-${{ github.run_number }}"
          name: "Demo Release ${{ github.run_number }}"
          prerelease: true
          files: packages/page-agent/dist/iife/page-agent.demo.js
